<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塗り絵アトリエ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
  <style>
    :root { font-family:system-ui,"Noto Sans JP",sans-serif; color:#293547; background:#fff8ed; }
    * { box-sizing:border-box; }
    body { margin:0; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .app { height:100vh; height:100dvh; display:flex; flex-direction:column; padding:12px; gap:10px; }
    header { display:flex; flex:none; align-items:center; justify-content:space-between; gap:12px; padding:0 6px; }
    h1 { margin:0; font-size:22px; letter-spacing:.03em; }
    .subtitle { margin:2px 0 0; color:#6b7480; font-size:12px; }
    .title { width:240px; max-width:42vw; padding:9px 11px; border:1px solid #e2daca; border-radius:11px; background:white; }
    .main { flex:1; min-height:0; display:grid; grid-template-columns:310px minmax(0,1fr); gap:10px; }
    .panel,.work { min-height:0; background:white; border:1px solid #eadfce; border-radius:17px; box-shadow:0 7px 22px #61533516; overflow:hidden; }
    .panel { overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:13px; }
    .group { display:flex; flex-direction:column; gap:7px; }
    .group-title { font-size:12px; font-weight:800; color:#687180; }
    .row { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
    .button, .file-button, select { min-height:38px; padding:7px 11px; border:1px solid #d9dee7; border-radius:10px; background:white; color:#334155; }
    .button:hover,.file-button:hover { background:#f5f7fa; }
    .button.active { background:#295e94; border-color:#295e94; color:white; }
    .file-button { display:inline-flex; align-items:center; cursor:pointer; font-weight:700; }
    .file-button input { display:none; }
    #imageSelect { min-width:125px; max-width:100%; flex:1; }
    #brushType { width:100%; }
    .palette { display:grid; grid-template-columns:repeat(6,1fr); gap:7px; }
    .swatch { width:36px; height:36px; max-width:100%; border:2px solid white; border-radius:50%; box-shadow:0 0 0 1px #ccd2da; }
    .swatch.active { box-shadow:0 0 0 3px #295e94; }
    .custom-color { display:flex; align-items:center; gap:8px; font-size:12px; }
    .custom-color input { width:40px; height:34px; border:0; background:none; }
    .slider { display:grid; grid-template-columns:78px minmax(55px,1fr) 42px; align-items:center; gap:5px; font-size:12px; }
    .slider input { width:100%; accent-color:#295e94; }
    .slider output { text-align:right; font-variant-numeric:tabular-nums; }
    .work { display:flex; flex-direction:column; }
    .canvas-shell { position:relative; flex:1; min-height:0; min-width:0; display:flex; overflow:auto; background:#f7f4ee; background-image:radial-gradient(#e0dbd1 1px, transparent 1px); background-size:20px 20px; }
    .frame { flex:none; position:relative; margin:auto; background:white; box-shadow:0 4px 20px #4d42352b; touch-action:none; }
    .frame canvas { position:absolute; inset:0; width:100%; height:100%; }
    #paintCanvas { mix-blend-mode:multiply; }
    .empty { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:15px; color:#6b7480; pointer-events:none; }
    .empty[hidden] { display:none; }
    .foot { flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border-top:1px solid #ece6dc; font-size:12px; color:#64748b; }
    #status { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .download { flex:none; background:#ec705a; color:white; border:0; border-radius:10px; padding:10px 15px; font-weight:800; }
    .download:disabled { opacity:.5; cursor:not-allowed; }
    @media(max-width:900px) {
      .app { padding:0; gap:0; }
      header { padding:7px 12px; }
      h1 { font-size:18px; }
      .subtitle { display:none; }
      .title { width:38vw; padding:6px 8px; }
      .main { display:flex; flex-direction:column; gap:0; }
      .panel,.work { border-radius:0; box-shadow:none; border-left:0; border-right:0; }
      .panel { flex:none; overflow:visible; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 12px; padding:8px 10px; }
      .group { min-width:0; gap:3px; }
      .group-title { font-size:11px; }
      .group.files,.group.palette-group { grid-column:1/-1; }
      .palette { display:flex; flex-wrap:wrap; gap:7px; }
      .swatch { width:29px; height:29px; }
      .custom-color { display:none; }
      .slider { grid-template-columns:62px minmax(25px,1fr) 32px; font-size:11px; }
      .button,.file-button,select { min-height:32px; padding:4px 7px; font-size:12px; }
      .group.actions { grid-column:1/-1; }
      .group.actions .row { justify-content:center; }
      .work { flex:1; }
      .foot { padding:6px 9px; }
    }
    @media(max-width:470px) {
      .panel { gap:5px 8px; padding:6px 8px; }
      .palette { gap:5px; }
      .swatch { width:25px; height:25px; }
      .group-title { display:none; }
      .slider { grid-template-columns:56px minmax(25px,1fr) 29px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>🎨 塗り絵アトリエ</h1><p class="subtitle">すきな色で、のびのび塗ろう</p></div>
    <input id="title" class="title" aria-label="作品名" placeholder="作品の名前">
  </header>
  <main class="main">
    <aside class="panel" aria-label="塗り絵の道具">
      <div class="group files"><div class="group-title">下絵</div><div class="row">
        <label class="file-button">画像をえらぶ <input id="files" type="file" accept="image/*" multiple></label>
        <select id="imageSelect" aria-label="下絵を切り替える" disabled><option value="">下絵をえらぶ</option></select>
      </div></div>
      <div class="group palette-group"><div class="group-title">色をえらぶ</div>
        <div id="palette" class="palette" role="group" aria-label="基本色"></div>
        <label class="custom-color">ほかの色 <input id="customColor" type="color" value="#e94d52"></label>
      </div>
      <div class="group"><div class="group-title">道具</div><div class="row">
        <button type="button" class="button active" data-tool="brush">🖌 ぬる</button>
        <button type="button" class="button" data-tool="fill">▣ 塗りつぶし</button>
        <button type="button" class="button" data-tool="eraser">⌫ 消す</button>
      </div></div>
      <div class="group"><label class="group-title" for="brushType">筆の種類</label>
        <select id="brushType"><option value="pencil">えんぴつ</option><option value="brush" selected>ふで</option><option value="air">エアブラシ</option></select>
      </div>
      <div class="group"><div class="slider"><label for="size">筆の大きさ</label><input id="size" type="range" min="2" max="100" value="30"><output id="sizeValue">30</output></div>
        <div class="slider"><label for="density">色の濃さ</label><input id="density" type="range" min="10" max="100" value="80"><output id="densityValue">80%</output></div>
        <div class="slider"><label for="blur">ふちのぼかし</label><input id="blur" type="range" min="0" max="100" value="25"><output id="blurValue">25%</output></div>
        <div class="slider"><label for="tolerance">塗りの広がり</label><input id="tolerance" type="range" min="0" max="100" value="40"><output id="toleranceValue">40</output></div>
      </div>
      <div class="group actions"><div class="row">
        <button id="undo" type="button" class="button">↶ もどす</button><button id="redo" type="button" class="button">↷ やりなおす</button>
        <button id="clear" type="button" class="button">ぜんぶ消す</button>
        <button id="zoomOut" type="button" class="button" aria-label="縮小">−</button><span id="zoomLabel" aria-live="polite">100%</span>
        <button id="zoomIn" type="button" class="button" aria-label="拡大">＋</button><button id="fit" type="button" class="button">画面に合わせる</button>
      </div></div>
    </aside>
    <section class="work" aria-label="塗り絵の画面">
      <div id="shell" class="canvas-shell"><div id="frame" class="frame">
        <canvas id="guideCanvas"></canvas><canvas id="paintCanvas"></canvas>
      </div><div id="empty" class="empty">「画像をえらぶ」から<br>塗り絵の下絵を開いてね</div></div>
      <div class="foot"><span id="status" role="status">下絵を選ぶと塗り始められます</span><button id="download" class="download" type="button" disabled>画像を保存</button></div>
    </section>
  </main>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const guide = $('guideCanvas'), paint = $('paintCanvas');
  const guideCtx = guide.getContext('2d', { willReadFrequently:true });
  const paintCtx = paint.getContext('2d', { willReadFrequently:true });
  const shell = $('shell'), frame = $('frame'), status = $('status');
  const colors = ['#e94d52','#f79442','#f8c83b','#64bd68','#36a9bc','#387bdd',
    '#8d61c7','#ec77b7','#8b5c42','#222c3c','#ffffff','#a8dfe5'];
  let color = colors[0], tool = 'brush', zoom = 1, active = null, drawing = false, last = null, pixels = null, restoreToken = 0;
  const items = [];

  function setColor(next) {
    color = next.toLowerCase(); $('customColor').value = color;
    document.querySelectorAll('.swatch').forEach(b => {
      const selected = b.dataset.color === color;
      b.classList.toggle('active', selected); b.setAttribute('aria-pressed', String(selected));
    });
  }
  for (const hex of colors) {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'swatch'; button.dataset.color = hex;
    button.style.background = hex; button.setAttribute('aria-label', `${hex} を選ぶ`);
    button.addEventListener('click', () => setColor(hex)); $('palette').append(button);
  }
  setColor(color);
  $('customColor').addEventListener('input', e => setColor(e.target.value));
  document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => {
    tool = b.dataset.tool;
    document.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('active', x === b));
  }));
  for (const id of ['size','density','blur','tolerance']) {
    $(id).addEventListener('input', () => $(id+'Value').textContent = $(id).value + (id === 'density' || id === 'blur' ? '%' : ''));
  }

  function layout() {
    if (!shell.clientWidth || !shell.clientHeight) return;
    const w = active?.width || 700, h = active?.height || 600;
    const fit = Math.min((shell.clientWidth - 24) / w, (shell.clientHeight - 24) / h);
    const scale = Math.max(.01, fit * zoom);
    frame.style.width = `${Math.round(w * scale)}px`;
    frame.style.height = `${Math.round(h * scale)}px`;
    $('zoomLabel').textContent = `${Math.round(zoom * 100)}%`;
  }
  function setZoom(value) {
    zoom = Math.max(.5, Math.min(4, value)); layout();
  }
  $('zoomOut').onclick = () => setZoom(zoom / 1.25);
  $('zoomIn').onclick = () => setZoom(zoom * 1.25);
  $('fit').onclick = () => { setZoom(1); shell.scrollTo(0,0); };
  new ResizeObserver(layout).observe(shell);
  window.addEventListener('resize', layout);

  function updateHistoryButtons() {
    $('undo').disabled = !active || active.index <= 0;
    $('redo').disabled = !active || active.index >= active.history.length - 1;
  }
  function saveHistory() {
    if (!active) return;
    active.history = active.history.slice(0, active.index + 1);
    active.history.push(paint.toDataURL('image/png'));
    if (active.history.length > 16) active.history.shift();
    active.index = active.history.length - 1;
    updateHistoryButtons();
  }
  async function restore() {
    if (!active) return;
    const item = active, token = ++restoreToken, data = item.history[item.index];
    paintCtx.clearRect(0,0,paint.width,paint.height);
    updateHistoryButtons();
    if (!data) return;
    const image = new Image(); image.src = data;
    try {
      await image.decode();
      if (token === restoreToken && active === item) paintCtx.drawImage(image,0,0);
    } catch { if (token === restoreToken) status.textContent = '描画を戻せませんでした'; }
  }
  $('undo').onclick = () => { if (active?.index > 0) { active.index--; restore(); } };
  $('redo').onclick = () => { if (active && active.index < active.history.length - 1) { active.index++; restore(); } };
  $('clear').onclick = () => {
    if (!active) return;
    ++restoreToken;
    paintCtx.clearRect(0,0,paint.width,paint.height); saveHistory();
    status.textContent = 'この下絵の色を消しました';
  };

  function selectItem(item) {
    if (drawing) finishStroke();
    active = item; ++restoreToken;
    guide.width = paint.width = item.width;
    guide.height = paint.height = item.height;
    guideCtx.fillStyle = '#fff'; guideCtx.fillRect(0,0,item.width,item.height);
    guideCtx.drawImage(item.image,0,0,item.width,item.height);
    item.source = guideCtx.getImageData(0,0,item.width,item.height).data;
    zoom = 1; layout(); shell.scrollTo(0,0);
    $('empty').hidden = true; $('imageSelect').value = String(items.indexOf(item));
    $('download').disabled = false; restore();
    status.textContent = `${item.file.name}（${item.image.naturalWidth} × ${item.image.naturalHeight}）`;
  }
  $('files').addEventListener('change', async e => {
    let first = null, failures = 0;
    for (const file of [...e.target.files]) {
      if (!file.type.startsWith('image/')) { failures++; continue; }
      const url = URL.createObjectURL(file);
      try {
        const image = new Image(); image.src = url; await image.decode();
        const scale = Math.min(1, 1400 / Math.max(image.naturalWidth,image.naturalHeight));
        const item = { file,image,url,width:Math.max(1,Math.round(image.naturalWidth*scale)),
          height:Math.max(1,Math.round(image.naturalHeight*scale)),history:[''],index:0,source:null };
        items.push(item); $('imageSelect').add(new Option(file.name,String(items.length-1)));
        if (!first) first = item;
      } catch { URL.revokeObjectURL(url); failures++; }
    }
    $('imageSelect').disabled = !items.length;
    if (first) selectItem(first);
    if (failures) status.textContent += `／開けない画像 ${failures}件`;
    e.target.value = '';
  });
  $('imageSelect').addEventListener('change', e => {
    const item = items[Number(e.target.value)];
    if (item && item !== active) selectItem(item);
  });
  window.addEventListener('pagehide', () => items.forEach(i => URL.revokeObjectURL(i.url)));

  function point(e) {
    const rect = frame.getBoundingClientRect();
    return { x:(e.clientX-rect.left)*paint.width/rect.width, y:(e.clientY-rect.top)*paint.height/rect.height };
  }
  function rgb() { return [1,3,5].map(i => parseInt(color.slice(i,i+2),16)); }
  function dab(x,y) {
    const type = $('brushType').value;
    const size = +$('size').value;
    const radius = Math.max(1,size * (type === 'pencil' ? .28 : type === 'air' ? .85 : .5));
    const feather = Math.min(.96,(+$('blur').value/100)*.83+(type === 'air' ? .42 : type === 'brush' ? .05 : 0));
    const solid = radius * (1-feather), density = +$('density').value/100;
    const [r,g,b] = rgb(), data = pixels.data;
    const left = Math.max(0,Math.floor(x-radius)), right = Math.min(paint.width-1,Math.ceil(x+radius));
    const top = Math.max(0,Math.floor(y-radius)), bottom = Math.min(paint.height-1,Math.ceil(y+radius));
    for(let py=top;py<=bottom;py++) for(let px=left;px<=right;px++) {
      const d = Math.hypot(px+.5-x,py+.5-y);
      if (d>radius) continue;
      if (type === 'pencil' && ((px*37+py*73)%17)===0) continue;
      let coverage = d<=solid ? 1 : Math.max(0,(radius-d)/(radius-solid));
      if (type === 'air') coverage *= coverage;
      const alpha = Math.round(255*density*coverage);
      if (!alpha) continue;
      const p=(py*paint.width+px)*4;
      if (tool === 'eraser') { data[p+3]=0; continue; }
      if (data[p]===r && data[p+1]===g && data[p+2]===b && data[p+3]>0) {
        data[p+3]=Math.max(data[p+3],alpha); // 同じ色を重ねても濃くしない
      } else if (alpha>8) {
        data[p]=r; data[p+1]=g; data[p+2]=b; data[p+3]=alpha;
      }
    }
    paintCtx.putImageData(pixels,0,0,left,top,right-left+1,bottom-top+1);
  }
  function strokeTo(next) {
    const distance = Math.hypot(next.x-last.x,next.y-last.y);
    const step = Math.max(1,+$('size').value*.13);
    const count = Math.max(1,Math.ceil(distance/step));
    for (let i=1;i<=count;i++) dab(last.x+(next.x-last.x)*i/count,last.y+(next.y-last.y)*i/count);
    last=next;
  }
  function finishStroke() {
    if (!drawing) return;
    drawing=false; pixels=null; last=null; saveHistory();
  }

  function findRegion(source,w,h,sx,sy,tolerance) {
    const first=sy*w+sx, seed=first*4;
    const sr=source[seed],sg=source[seed+1],sb=source[seed+2];
    const visited=new Uint8Array(w*h), queue=new Int32Array(w*h);
    queue[0]=first; visited[first]=1;
    let head=0,tail=1;
    while(head<tail) {
      const i=queue[head++], x=i%w, y=(i-x)/w;
      const candidates=[x>0?i-1:-1,x<w-1?i+1:-1,y>0?i-w:-1,y<h-1?i+w:-1];
      for(const j of candidates) {
        if(j<0||visited[j])continue;
        visited[j]=1;
        const p=j*4;
        if(Math.max(Math.abs(source[p]-sr),Math.abs(source[p+1]-sg),Math.abs(source[p+2]-sb))<=tolerance) queue[tail++]=j;
      }
    }
    return { queue,count:tail };
  }
  function fillAt(x,y) {
    const sx=Math.floor(x),sy=Math.floor(y),w=paint.width,h=paint.height;
    if(sx<0||sy<0||sx>=w||sy>=h)return;
    ++restoreToken;
    const {queue,count}=findRegion(active.source,w,h,sx,sy,+$('tolerance').value);
    const data=paintCtx.getImageData(0,0,w,h), dest=data.data;
    const [r,g,b]=rgb(),alpha=Math.round(255*(+$('density').value/100));
    for(let n=0;n<count;n++) {
      const p=queue[n]*4;
      dest[p]=r;dest[p+1]=g;dest[p+2]=b;dest[p+3]=alpha;
    }
    paintCtx.putImageData(data,0,0); saveHistory();
    status.textContent=`${count.toLocaleString()}画素を塗りました`;
  }
  paint.addEventListener('pointerdown',e => {
    if(!active)return;
    const p=point(e);
    if(tool==='fill') { fillAt(p.x,p.y); return; }
    ++restoreToken;
    paint.setPointerCapture(e.pointerId);
    drawing=true; last=p; pixels=paintCtx.getImageData(0,0,paint.width,paint.height);
    dab(p.x,p.y);
  });
  paint.addEventListener('pointermove',e => { if(drawing)strokeTo(point(e)); });
  paint.addEventListener('pointerup',e => { if(drawing)strokeTo(point(e)); finishStroke(); });
  paint.addEventListener('pointercancel',finishStroke);
  paint.addEventListener('lostpointercapture',finishStroke);

  $('download').addEventListener('click',() => {
    if(!active)return;
    const result=document.createElement('canvas');result.width=guide.width;result.height=guide.height;
    const ctx=result.getContext('2d');ctx.drawImage(guide,0,0);
    ctx.globalCompositeOperation='multiply';ctx.drawImage(paint,0,0);
    result.toBlob(blob => {
      if(!blob){status.textContent='画像を保存できませんでした';return;}
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      const name=($('title').value.trim()||'ぬりえ').replace(/[\\/:*?"<>|]/g,'_');
      a.href=url;a.download=`${name}.png`;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
      status.textContent='下絵と色を合わせたPNGを保存しました';
    },'image/png');
  });
  updateHistoryButtons();layout();
})();
</script>
</body>
</html>
